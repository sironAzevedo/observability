name: "[ROLLBACK] - Deploy de Emergência"

on:
  issues:
    types: [opened, labeled]
  workflow_dispatch:
    inputs:
      target_tag:
        description: 'Tag / Versão para Rollback (ex: 1.0.1)'
        required: true
        type: string
      reason:
        description: 'Motivo do Rollback'
        required: true
        type: string

permissions:
  contents: write
  issues: write
  id-token: write

jobs:
  rollback_init:
    name: Processar Solicitação de Rollback
    if: contains(github.event.issue.labels.*.name, 'rollback') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      TARGET_TAG: ${{ steps.parse_inputs.outputs.TARGET_TAG }}
      REASON: ${{ steps.parse_inputs.outputs.REASON }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Parse Inputs or Issue Body
        id: parse_inputs
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TARGET_TAG="${{ inputs.target_tag }}"
            REASON="${{ inputs.reason }}"
          else
            ISSUE_BODY='${{ github.event.issue.body }}'
            
            # Extrai os campos do formulário da Issue
            TARGET_TAG=$(echo "$ISSUE_BODY" | grep -A 2 "Tag / Versão para Rollback" | tail -n 1 | xargs)
            REASON=$(echo "$ISSUE_BODY" | grep -A 2 "Motivo do Rollback" | tail -n 1 | xargs)
            
            if [ -z "$TARGET_TAG" ] || [ "$TARGET_TAG" = "_No response_" ]; then
              TARGET_TAG=$(echo "$ISSUE_BODY" | grep -oE '1\.0\.[0-9]+' | head -n1)
            fi
          fi
          
          # Remover prefixo 'v' se presente (ex: v1.0.1 -> 1.0.1)
          TARGET_TAG="${TARGET_TAG#v}"
          
          echo "TARGET_TAG=${TARGET_TAG}" >> $GITHUB_OUTPUT
          echo "REASON=${REASON}" >> $GITHUB_OUTPUT
          
          echo "Tag selecionada para rollback: $TARGET_TAG"
          echo "Motivo: $REASON"

      - name: Comment on Issue - Rollback Started
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          gh issue comment ${{ github.event.issue.number }} --body "🚀 **Rollback Iniciado!**
          
          - **Versão Alvo:** \`${{ steps.parse_inputs.outputs.TARGET_TAG }}\`
          - **Motivo:** ${{ steps.parse_inputs.outputs.REASON }}
          - **Solicitante:** @${{ github.actor }}
          
          Aguarde a conclusão do deploy da versão na VPS..."

  execute_rollback_deploy:
    name: Executar Deploy do Rollback
    needs: rollback_init
    uses: ./.github/workflows/execute-deploy.yml
    with:
      environment: 'prod'
      github_environment: 'production'
      override_version: ${{ needs.rollback_init.outputs.TARGET_TAG }}
    secrets:
      github-token: ${{ secrets.GH_TOKEN }}
      vps-host: ${{ secrets.VPS_HOST }}
      vps-username: ${{ secrets.VPS_USERNAME }}
      vps-ssh-private-key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
      APP_SECRETS: ${{ secrets.APP_SECRETS }}

  finalize_rollback_issue:
    name: Finalizar Issue de Rollback
    needs: [ rollback_init, execute_rollback_deploy ]
    if: always() && github.event_name == 'issues'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Comment and Close Issue on Success
        if: needs.execute_rollback_deploy.result == 'success'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          gh issue comment ${{ github.event.issue.number }} --body "✅ **Rollback Concluído com Sucesso!**
          
          A versão **${{ needs.rollback_init.outputs.TARGET_TAG }}** foi implantada com sucesso em produção e validada via Health Check.
          
          Esta Issue foi encerrada automaticamente."
          
          gh issue close ${{ github.event.issue.number }} --reason "completed"

      - name: Comment on Failure
        if: needs.execute_rollback_deploy.result != 'success'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          gh issue comment ${{ github.event.issue.number }} --body "❌ **Falha ao Executar o Rollback!**
          
          Ocorreu um erro durante o deploy da versão **${{ needs.rollback_init.outputs.TARGET_TAG }}**. Verifique os logs do GitHub Actions para mais detalhes."
