name: Observability Stack Deploy

on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: false
        default: 'prod'
      github_environment:
        required: false
        type: string
        default: 'production'
      override_version:
        required: false
        type: string
        default: ''
    secrets:
      github-token:
        required: false
      vps-host:
        required: true
      vps-username:
        required: true
      vps-ssh-private-key:
        required: true
      APP_SECRETS:
        required: false

  workflow_dispatch:
    inputs:
      environment:
        description: 'Ambiente de Deploy'
        required: true
        default: 'prod'
        type: choice
        options:
          - prod
          - dev
      override_version:
        description: 'Versão para Deploy/Rollback sob demanda (ex: 1.0.1)'
        required: false
        type: string
        default: ''

permissions:
  id-token: write
  contents: write

jobs:
  deploy:
    name: Deploy Observability Stack
    runs-on: ubuntu-latest
    environment: ${{ inputs.github_environment || (inputs.environment == 'prod' && 'production' || 'development') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read config.json for selected environment
        id: json_config
        run: |
          ENV_NAME="${{ inputs.environment }}"
          echo "Reading configuration for environment: $ENV_NAME"
          
          CONFIG_PATH="infra/$ENV_NAME/config.json"
          if [ ! -f "$CONFIG_PATH" ]; then
            echo "❌ Arquivo de configuração $CONFIG_PATH não encontrado!"
            exit 1
          fi
          
          sudo apt-get update && sudo apt-get install -y jq
          APP_NAME=$(jq -r '.nameAPP // "observability-stack"' "$CONFIG_PATH")
          DEPLOY_PATH=$(jq -r '.deployPath // "/opt/observability"' "$CONFIG_PATH")
          DOCKER_NETWORK=$(jq -r '.dockerNetwork // "app-network"' "$CONFIG_PATH")
          ES_PORT=$(jq -r '.ports.elasticsearch // "9200"' "$CONFIG_PATH")
          KIBANA_PORT=$(jq -r '.ports.kibana // "5601"' "$CONFIG_PATH")
          LOGSTASH_PORT=$(jq -r '.ports.logstash // "5044"' "$CONFIG_PATH")
          
          echo "APP_NAME=${APP_NAME}" >> $GITHUB_OUTPUT
          echo "DEPLOY_PATH=${DEPLOY_PATH}" >> $GITHUB_OUTPUT
          echo "DOCKER_NETWORK=${DOCKER_NETWORK}" >> $GITHUB_OUTPUT
          echo "ES_PORT=${ES_PORT}" >> $GITHUB_OUTPUT
          echo "KIBANA_PORT=${KIBANA_PORT}" >> $GITHUB_OUTPUT
          echo "LOGSTASH_PORT=${LOGSTASH_PORT}" >> $GITHUB_OUTPUT
          
          echo "Application: $APP_NAME"
          echo "Deploy Path: $DEPLOY_PATH"
          echo "Docker Network: $DOCKER_NETWORK"

      - name: Extract Release Version for Deploy
        id: versioning
        run: |
          OVERRIDE_VER="${{ inputs.override_version }}"
          
          # 1. Obter do histórico do git
          GIT_VER=$(git log -n 10 --oneline 2>/dev/null | grep -oE 'release/1\.0\.[0-9]+|1\.0\.[0-9]+' | head -n1 | sed 's|release/||' || true)
          echo "Versão no histórico do Git: $GIT_VER"
          
          # 2. Obter última tag do Git
          git fetch --tags origin 2>/dev/null || true
          LAST_TAG=$(git tag -l "v1.0.*" 2>/dev/null | sort -V | tail -n1 | sed 's|^v||' || true)
          echo "Última tag Git: $LAST_TAG"
          
          # Seleção final da versão
          if [ -n "$OVERRIDE_VER" ]; then
            APP_VERSION="${OVERRIDE_VER#v}"
            echo "Aviso: Utilizando versão sob demanda: $APP_VERSION"
          elif [ -n "$GIT_VER" ]; then
            APP_VERSION="$GIT_VER"
          elif [ -n "$LAST_TAG" ]; then
            APP_VERSION="$LAST_TAG"
          else
            APP_VERSION="1.0.1"
          fi
          
          echo "APP_VERSION=${APP_VERSION}" >> $GITHUB_OUTPUT
          echo "✅ Versão final selecionada para deploy: $APP_VERSION"

      - name: Generate .env Configuration
        id: generate_env
        env:
          APP_SECRETS: ${{ secrets.APP_SECRETS }}
          ENV_NAME: ${{ inputs.environment }}
        run: |
          CONFIG_PATH="infra/$ENV_NAME/config.json"
          
          echo "# Generated by GitHub Actions Deploy" > .env
          
          if [ -n "$APP_SECRETS" ]; then
            echo "Resolving SECRET:: references with APP_SECRETS..."
            RESOLVED_ENV=$(jq -r --argjson secrets "$APP_SECRETS" '
              .environment[]? | 
              if .value | startswith("SECRET::") then
                "\(.name)=\($secrets[.value[8:]] // "")"
              else
                "\(.name)=\(.value)"
              end
            ' "$CONFIG_PATH")
          else
            echo "Using direct values from config.json (no APP_SECRETS supplied)..."
            RESOLVED_ENV=$(jq -r '
              .environment[]? | 
              if .value | startswith("SECRET::") then
                "\(.name)="
              else
                "\(.name)=\(.value)"
              end
            ' "$CONFIG_PATH")
          fi
          
          echo "$RESOLVED_ENV" >> .env
          echo "✅ .env gerado com sucesso (mascarando dados sensíveis):"
          sed 's/=.*$/=******/' .env

      - name: Ensure Remote Directory Exists on VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.vps-host }}
          username: ${{ secrets.vps-username }}
          key: ${{ secrets.vps-ssh-private-key }}
          script: |
            set -euo pipefail
            DEPLOY_PATH="${{ steps.json_config.outputs.DEPLOY_PATH }}"
            echo "Garantindo existência do diretório de destino: $DEPLOY_PATH"
            sudo mkdir -p "$DEPLOY_PATH"
            sudo chown -R "$(whoami)":"$(whoami)" "$DEPLOY_PATH"

      - name: Transfer Project Files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.vps-host }}
          username: ${{ secrets.vps-username }}
          key: ${{ secrets.vps-ssh-private-key }}
          source: "docker-compose.yml,config,scripts,.env"
          target: ${{ steps.json_config.outputs.DEPLOY_PATH }}
          overwrite: true

      - name: Execute Deploy and Health Check on VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.vps-host }}
          username: ${{ secrets.vps-username }}
          key: ${{ secrets.vps-ssh-private-key }}
          script: |
            set -euo pipefail
            DEPLOY_PATH="${{ steps.json_config.outputs.DEPLOY_PATH }}"
            DOCKER_NETWORK="${{ steps.json_config.outputs.DOCKER_NETWORK }}"
            ES_PORT="${{ steps.json_config.outputs.ES_PORT }}"
            KIBANA_PORT="${{ steps.json_config.outputs.KIBANA_PORT }}"
            LOGSTASH_PORT="${{ steps.json_config.outputs.LOGSTASH_PORT }}"

            cd "$DEPLOY_PATH"

            echo "=========================================================="
            echo "🚀 Iniciando deploy da stack de observabilidade na VPS..."
            echo "=========================================================="

            # 1. Ajuste de Kernel para o Elasticsearch
            CURRENT_MAP=$(sysctl -n vm.max_map_count 2>/dev/null || echo 0)
            if [ "$CURRENT_MAP" -lt 262144 ]; then
              echo "Ajustando vm.max_map_count para 262144..."
              sudo sysctl -w vm.max_map_count=262144 || true
            fi

            # 2. Garantir que a rede Docker compartilhada existe
            if ! docker network inspect "$DOCKER_NETWORK" > /dev/null 2>&1; then
              echo "Criando rede docker externa: $DOCKER_NETWORK..."
              docker network create "$DOCKER_NETWORK" || true
            fi

            # 3. Pull das imagens oficiais do Elastic Stack
            echo "📦 Baixando as imagens da stack..."
            docker compose pull

            # 4. Inicialização da Stack
            echo "🔄 Subindo containers da stack..."
            docker compose up -d --remove-orphans

            # 5. Validação de Saúde (Health Checks)
            echo "⏳ Aguardando serviços ficarem operacionais..."
            
            # 5.1 Validação do Elasticsearch
            echo "🩺 [1/3] Verificando saúde do Elasticsearch (porta $ES_PORT)..."
            ES_UP=false
            for i in {1..30}; do
              sleep 4
              ES_STATUS=$(curl -s "http://localhost:${ES_PORT}/_cluster/health" 2>/dev/null || true)
              if echo "$ES_STATUS" | grep -Eq '"status":"(green|yellow)"'; then
                echo "✅ Elasticsearch operacional! Detalhes: $ES_STATUS"
                ES_UP=true
                break
              fi
              echo "⚪️ Tentativa $i/30: aguardando Elasticsearch..."
            done

            if [ "$ES_UP" != "true" ]; then
              echo "❌ Elasticsearch não respondeu com sucesso dentro do tempo limite!"
              docker compose logs --tail=50 elasticsearch
              exit 1
            fi

            # 5.2 Validação do Kibana
            echo "🩺 [2/3] Verificando saúde do Kibana (porta $KIBANA_PORT)..."
            KIBANA_UP=false
            for i in {1..30}; do
              sleep 4
              KIBANA_HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:${KIBANA_PORT}/api/status" 2>/dev/null || true)
              if [ "$KIBANA_HTTP_CODE" = "200" ] || [ "$KIBANA_HTTP_CODE" = "302" ]; then
                echo "✅ Kibana operacional! (HTTP $KIBANA_HTTP_CODE)"
                KIBANA_UP=true
                break
              fi
              echo "⚪️ Tentativa $i/30: aguardando Kibana (HTTP atual: $KIBANA_HTTP_CODE)..."
            done

            if [ "$KIBANA_UP" != "true" ]; then
              echo "⚠️ Alerta: Kibana pode ainda estar inicializando. Verificando logs..."
              docker compose logs --tail=30 kibana
            fi

            # 5.3 Validação dos containers
            echo "🩺 [3/3] Status geral dos containers da stack:"
            docker compose ps

            echo "=========================================================="
            echo "🎉 Deploy da stack finalizado com sucesso na VPS!"
            echo "=========================================================="

      - name: Create and Push Release Tag in GitHub
        if: success() && inputs.override_version == '' && secrets.github-token != ''
        run: |
          APP_VERSION="${{ steps.versioning.outputs.APP_VERSION }}"
          TAG_NAME="v${APP_VERSION#v}"
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          echo "Criando e enviando a tag $TAG_NAME para o repositório..."
          git tag -f "$TAG_NAME" -m "Release $APP_VERSION implantada com sucesso em produção"
          git push origin "$TAG_NAME" --force
        env:
          GITHUB_TOKEN: ${{ secrets.github-token }}
