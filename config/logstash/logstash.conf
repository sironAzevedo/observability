input {
  beats {
    port => 5044
  }
}

filter {
  # ----------------------------------------------------------------------------
  # 1. Parsing Inicial: Detecta se a mensagem já é um JSON estruturado
  # ----------------------------------------------------------------------------
  if [message] =~ /^\{.*\}$/ {
    json {
      source => "message"
      skip_on_invalid_json => true
    }
  } else {
    # --------------------------------------------------------------------------
    # Fallback para Logs em Texto Puro (Spring Boot padrão, Python, Node, etc.)
    # --------------------------------------------------------------------------
    grok {
      match => {
        # Pattern 1: Spring Boot com padrão [%d{ISO8601}] %-5p [%t] %-36c{1} %X{transaction.id}: %m %n
        "message" => "^\[%{TIMESTAMP_ISO8601:raw_timestamp}\]\s+%{LOGLEVEL:raw_level}\s+\[%{DATA:thread}\]\s+%{DATA:logger_name}\s+(%{DATA:extracted_transaction_id})?:\s+%{GREEDYDATA:clean_message}"
      }
      match => {
        # Pattern 2: Python logging.basicConfig format="%(asctime)s [%(levelname)s] %(name)s: %(message)s"
        "message" => "^%{TIMESTAMP_ISO8601:raw_timestamp}\s+\[%{LOGLEVEL:raw_level}\]\s+%{DATA:logger_name}:\s+%{GREEDYDATA:clean_message}"
      }
      match => {
        # Pattern 3: Genérico [LEVEL] Mensagem
        "message" => "^\[%{LOGLEVEL:raw_level}\]\s+%{GREEDYDATA:clean_message}"
      }
      tag_on_failure => [ "_grok_plain_text" ]
    }

    if [clean_message] {
      mutate {
        replace => { "message" => "%{clean_message}" }
        remove_field => [ "clean_message" ]
      }
    }

    if [raw_level] and ![level] {
      mutate {
        add_field => { "level" => "%{raw_level}" }
        remove_field => [ "raw_level" ]
      }
    }

    if [extracted_transaction_id] and [extracted_transaction_id] != "" {
      mutate {
        add_field => { "transaction.id" => "%{extracted_transaction_id}" }
        remove_field => [ "extracted_transaction_id" ]
      }
    }
  }

  # ----------------------------------------------------------------------------
  # 2. Extração Padronizada do Nome da Aplicação (service / service.keyword)
  # ----------------------------------------------------------------------------
  # Ordem de Precedência:
  # 1. Campo do JSON (service, service_name, app_name, appName, app, application)
  # 2. Metadados do Container Docker via Filebeat (container.name ou docker.container.name)
  # 3. Nome da Imagem Docker (container.image.name)
  # 4. Fallback padrão ("unknown-service")
  
  if ![service] {
    if [service_name] {
      mutate { add_field => { "service" => "%{service_name}" } }
    } else if [app_name] {
      mutate { add_field => { "service" => "%{app_name}" } }
    } else if [appName] {
      mutate { add_field => { "service" => "%{appName}" } }
    } else if [app] {
      mutate { add_field => { "service" => "%{app}" } }
    } else if [application] {
      mutate { add_field => { "service" => "%{application}" } }
    } else if [container][name] {
      mutate { add_field => { "service" => "%{[container][name]}" } }
    } else if [docker][container][name] {
      mutate { add_field => { "service" => "%{[docker][container][name]}" } }
    } else if [container][image][name] {
      mutate { add_field => { "service" => "%{[container][image][name]}" } }
    } else {
      mutate { add_field => { "service" => "unknown-service" } }
    }
  }

  # ----------------------------------------------------------------------------
  # 3. Higienização e Normalização do Nome do Serviço
  # ----------------------------------------------------------------------------
  mutate {
    # Remove barras no início (ex: "/fatura-services" -> "fatura-services")
    gsub => [ "service", "^/+", "" ]
    # Remove sufixos comuns de staging/deploy temporário
    gsub => [ "service", "_staging$", "" ]
    gsub => [ "service", "_old$", "" ]
    gsub => [ "service", "_test$", "" ]
    # Converte tudo para minúsculas
    lowercase => [ "service" ]
  }

  # ----------------------------------------------------------------------------
  # 4. Normalização do Nível de Severidade (level)
  # ----------------------------------------------------------------------------
  if ![level] {
    if [log][level] {
      mutate { copy => { "[log][level]" => "level" } }
    } else if [severity] {
      mutate { copy => { "severity" => "level" } }
    } else {
      mutate { add_field => { "level" => "info" } }
    }
  }

  mutate {
    lowercase => [ "level" ]
    gsub => [
      "level", "^warning$", "warn",
      "level", "^fatal$", "error",
      "level", "^err$", "error"
    ]
  }

  # ----------------------------------------------------------------------------
  # 5. Metadados Globais de Ambiente
  # ----------------------------------------------------------------------------
  if ![environment] {
    mutate {
      add_field => { "environment" => "production" }
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "microservices-logs-%{+YYYY.MM.dd}"
    user => "${ELASTIC_USER:elastic}"
    password => "${ELASTIC_PASSWORD:elastic123}"
  }
}
