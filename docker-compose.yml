services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELASTIC_VERSION:-8.13.0}
    container_name: elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=${ELASTIC_SECURITY_ENABLED:-true}
      - xpack.security.http.ssl.enabled=false
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD:-elastic123}
      - ES_JAVA_OPTS=-Xms${ES_HEAP:-512m} -Xmx${ES_HEAP:-512m}
    ports:
      - "${ES_PORT:-9200}:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    networks:
      - logging-net
      - app-network
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "curl -s -u elastic:$${ELASTIC_PASSWORD:-elastic123} http://localhost:9200/_cluster/health | grep -q '\"status\"'"]
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 30s

  elasticsearch-setup:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELASTIC_VERSION:-8.13.0}
    container_name: elasticsearch-setup
    restart: "no"
    networks:
      - logging-net
    environment:
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD:-elastic123}
    depends_on:
      elasticsearch:
        condition: service_healthy
    command: >
      bash -c '
        echo "Configurando senha do usuário de sistema do Kibana (kibana_system)..."
        until curl -s -u "elastic:$${ELASTIC_PASSWORD:-elastic123}" -X POST "http://elasticsearch:9200/_security/user/kibana_system/_password" \
          -H "Content-Type: application/json" \
          -d "{\"password\":\"$${ELASTIC_PASSWORD:-elastic123}\"}" | grep -q "^{}"; do
          sleep 2
        done
        echo "Usuário kibana_system configurado com sucesso!"
      '

  kibana:
    image: docker.elastic.co/kibana/kibana:${ELASTIC_VERSION:-8.13.0}
    container_name: kibana
    restart: unless-stopped
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=kibana_system
      - ELASTICSEARCH_PASSWORD=${ELASTIC_PASSWORD:-elastic123}
      - SERVER_HOST=0.0.0.0
      - XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY=${KIBANA_ENCRYPTION_KEY:-observability_kibana_encryption_key_secret_32char_min}
      - XPACK_REPORTING_ENCRYPTIONKEY=${KIBANA_ENCRYPTION_KEY:-observability_kibana_encryption_key_secret_32char_min}
      - XPACK_SECURITY_ENCRYPTIONKEY=${KIBANA_ENCRYPTION_KEY:-observability_kibana_encryption_key_secret_32char_min}
    ports:
      - "${KIBANA_PORT:-5601}:5601"
    networks:
      - logging-net
      - app-network
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
    depends_on:
      elasticsearch:
        condition: service_healthy
      elasticsearch-setup:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -s -I http://localhost:5601/api/status | grep -q 'HTTP/1.1 200' || curl -s http://localhost:5601/api/status | grep -q '\"overall\":{\"level\":\"available\"}'"]
      interval: 15s
      timeout: 10s
      retries: 6
      start_period: 30s

  logstash:
    image: docker.elastic.co/logstash/logstash:${ELASTIC_VERSION:-8.13.0}
    container_name: logstash
    restart: unless-stopped
    environment:
      - LS_JAVA_OPTS=-Xms${LS_HEAP:-512m} -Xmx${LS_HEAP:-512m}
      - ELASTIC_USER=elastic
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD:-elastic123}
    ports:
      - "${LOGSTASH_PORT:-5044}:5044"
    volumes:
      - ./config/logstash/logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro
      - ./config/logstash/logstash.yml:/usr/share/logstash/config/logstash.yml:ro
    networks:
      - logging-net
      - app-network
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -s -f http://localhost:9600 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  filebeat:
    image: docker.elastic.co/beats/filebeat:${ELASTIC_VERSION:-8.13.0}
    container_name: filebeat
    restart: unless-stopped
    user: root
    command: filebeat -e -strict.perms=false
    volumes:
      - ./config/filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    networks:
      - logging-net
      - app-network
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
    depends_on:
      - logstash

  metricbeat:
    image: docker.elastic.co/beats/metricbeat:${ELASTIC_VERSION:-8.13.0}
    container_name: metricbeat
    restart: unless-stopped
    user: root
    command: metricbeat -e -strict.perms=false -system.hostfs=/hostfs
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - ELASTIC_USER=elastic
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD:-elastic123}
    volumes:
      - ./config/metricbeat/metricbeat.yml:/usr/share/metricbeat/metricbeat.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys/fs/cgroup:/hostfs/sys/fs/cgroup:ro
      - /proc:/hostfs/proc:ro
    networks:
      - logging-net
      - app-network
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
    depends_on:
      elasticsearch:
        condition: service_healthy

  apm-server:
    image: docker.elastic.co/apm/apm-server:${ELASTIC_VERSION:-8.13.0}
    container_name: apm-server
    restart: unless-stopped
    command: apm-server -e -strict.perms=false
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - ELASTIC_USER=elastic
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD:-elastic123}
    ports:
      - "${APM_PORT:-8200}:8200"
    volumes:
      - ./config/apm-server/apm-server.yml:/usr/share/apm-server/apm-server.yml:ro
    networks:
      - logging-net
      - app-network
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -s -f http://localhost:8200/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  app-simulator:
    image: python:3.11-alpine
    container_name: app-simulator
    profiles:
      - simulator
    volumes:
      - ./scripts:/scripts:ro
    command: python3 -u /scripts/simulate_logs.py --mode normal --rate 2 --duration 60
    networks:
      - logging-net
      - app-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "2"

networks:
  logging-net:
    driver: bridge
  app-network:
    name: ${APP_NETWORK_NAME:-app-network}
    external: true

volumes:
  esdata:
    driver: local
